<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="suitcaseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="frontPocket" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="goldTag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1e293b" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background circular decorative shape -->
  <circle cx="250" cy="190" r="150" fill="url(#skyGrad)" />
  <circle cx="370" cy="100" r="30" fill="#ffffff" opacity="0.6" />
  <circle cx="120" cy="140" r="20" fill="#ffffff" opacity="0.6" />

  <!-- Dotted travel route path -->
  <path d="M 100 120 Q 180 60 270 90 T 400 80" stroke="#93c5fd" stroke-width="3" stroke-dasharray="6,6" fill="none" />
  
  <!-- Small paper airplane along path -->
  <g transform="translate(390, 75) rotate(-15) scale(0.9)">
    <polygon points="0,0 28,12 8,16 6,26" fill="#3b82f6" />
    <polygon points="0,0 28,12 8,16" fill="#60a5fa" />
  </g>

  <!-- Ground shadow -->
  <ellipse cx="250" cy="335" rx="140" ry="16" fill="#cbd5e1" opacity="0.7" />
  <ellipse cx="250" cy="335" rx="110" ry="10" fill="#94a3b8" opacity="0.4" />

  <!-- Luggage Wheels -->
  <g fill="#1e293b">
    <rect x="180" y="318" width="22" height="20" rx="6" />
    <circle cx="191" cy="334" r="5" fill="#64748b" />
    <rect x="298" y="318" width="22" height="20" rx="6" />
    <circle cx="309" cy="334" r="5" fill="#64748b" />
  </g>

  <!-- Telescopic Handle -->
  <rect x="215" y="80" width="12" height="90" rx="3" fill="#94a3b8" />
  <rect x="273" y="80" width="12" height="90" rx="3" fill="#94a3b8" />
  <rect x="205" y="65" width="90" height="18" rx="7" fill="#1e293b" />
  <rect x="220" y="73" width="60" height="5" rx="2" fill="#475569" />

  <!-- Main Suitcase Body with soft shadow -->
  <g filter="url(#softShadow)">
    <rect x="160" y="145" width="180" height="180" rx="28" fill="url(#suitcaseGrad)" />
    <!-- Inner groove pattern -->
    <rect x="175" y="160" width="150" height="150" rx="20" fill="url(#frontPocket)" />
    
    <!-- Vertical suitcase rib details -->
    <line x1="215" y1="175" x2="215" y2="295" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round" opacity="0.5" />
    <line x1="250" y1="175" x2="250" y2="295" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round" opacity="0.5" />
    <line x1="285" y1="175" x2="285" y2="295" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round" opacity="0.5" />

    <!-- Top Grab Handle -->
    <rect x="225" y="133" width="50" height="14" rx="5" fill="#1e293b" />
    <!-- Corner Protectors -->
    <path d="M 160 173 A 28 28 0 0 1 188 145 L 188 165 A 8 8 0 0 0 180 173 Z" fill="#1e293b" />
    <path d="M 340 173 A 28 28 0 0 0 312 145 L 312 165 A 8 8 0 0 1 320 173 Z" fill="#1e293b" />
    <path d="M 160 297 A 28 28 0 0 0 188 325 L 188 305 A 8 8 0 0 1 180 297 Z" fill="#1e293b" />
    <path d="M 340 297 A 28 28 0 0 1 312 325 L 312 305 A 8 8 0 0 0 320 297 Z" fill="#1e293b" />
  </g>

  <!-- Luggage Tag -->
  <g transform="translate(315, 170) rotate(18)">
    <line x1="0" y1="0" x2="0" y2="20" stroke="#f59e0b" stroke-width="2.5" />
    <rect x="-14" y="20" width="28" height="42" rx="5" fill="url(#goldTag)" filter="url(#softShadow)" />
    <circle cx="0" cy="27" r="3" fill="#ffffff" />
    <rect x="-9" y="36" width="18" height="4" rx="2" fill="#ffffff" opacity="0.8" />
    <rect x="-9" y="44" width="12" height="4" rx="2" fill="#ffffff" opacity="0.8" />
  </g>

  <!-- Decorative Travel Stickers on Suitcase -->
  <!-- Globe sticker -->
  <circle cx="210" cy="210" r="18" fill="#ffffff" />
  <circle cx="210" cy="210" r="16" fill="#10b981" />
  <ellipse cx="210" cy="210" rx="8" ry="16" stroke="#ffffff" stroke-width="1.5" fill="none" />
  <line x1="194" y1="210" x2="226" y2="210" stroke="#ffffff" stroke-width="1.5" />

  <!-- Compass Star sticker -->
  <g transform="translate(285, 260) scale(0.9)">
    <circle cx="0" cy="0" r="18" fill="#ffffff" />
    <polygon points="0,-14 4,-4 14,0 4,4 0,14 -4,4 -14,0 -4,-4" fill="#ef4444" />
  </g>

  <!-- Camera / Trip Tag -->
  <g transform="translate(230, 265)">
    <rect x="0" y="0" width="34" height="22" rx="5" fill="#f8fafc" />
    <circle cx="17" cy="11" r="6" fill="#334155" />
    <circle cx="17" cy="11" r="3" fill="#38bdf8" />
    <rect x="5" y="-3" width="8" height="3" rx="1" fill="#334155" />
  </g>

  <!-- Map / Passport peaking out of side -->
  <g transform="translate(130, 220) rotate(-18)">
    <rect x="0" y="0" width="45" height="65" rx="5" fill="#304766" filter="url(#softShadow)" />
    <rect x="4" y="4" width="37" height="57" rx="3" fill="#1e293b" />
    <circle cx="22" cy="28" r="10" stroke="#fbbf24" stroke-width="1.5" fill="none" />
    <text x="22" y="50" font-size="6" font-family="sans-serif" font-weight="bold" fill="#fbbf24" text-anchor="middle">PASSPORT</text>
  </g>

  <!-- Floating Sparkles / Stars -->
  <path d="M 125 105 Q 125 115 115 115 Q 125 115 125 125 Q 125 115 135 115 Q 125 115 125 105 Z" fill="#fbbf24" />
  <path d="M 375 160 Q 375 168 367 168 Q 375 168 375 176 Q 375 168 383 168 Q 375 168 375 160 Z" fill="#60a5fa" />
  <circle cx="345" cy="130" r="3" fill="#f59e0b" />
  <circle cx="150" cy="170" r="2.5" fill="#3b82f6" />
</svg>
